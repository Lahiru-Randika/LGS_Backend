
name: LGS Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lgs-backend-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/lahiru-randika/lgs_backend:sha-${{ github.sha }}
            ghcr.io/lahiru-randika/lgs_backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Lahiru-Randika/LGS_Backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend to DigitalOcean
    needs: build-and-publish
    runs-on: ubuntu-24.04

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ghcr.io/lahiru-randika/lgs_backend:sha-${{ github.sha }}
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              bash -s -- "$IMAGE" <<'REMOTE'
          set -euo pipefail

          IMAGE="$1"
          cd /opt/lgs/docker

          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

          echo "Saving previous backend image"
          OLD_IMAGE_ID=$(docker inspect lgs-backend --format '{{.Image}}')
          docker tag "$OLD_IMAGE_ID" lgs-backend:rollback

          cp .env .env.backend.backup
          chmod 600 .env.backend.backup

          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=$IMAGE|" .env

          echo "Deploying backend"

          health_check() {
            curl --fail --silent --show-error \
              --retry 15 \
              --retry-delay 2 \
              --retry-all-errors \
              --max-time 10 \
              http://127.0.0.1:4000/health \
              | grep -q '"database":true'
          }

          if docker compose up -d --no-deps --no-build lgs-backend \
             && health_check; then

            echo "Backend deployment successful"
            docker compose ps lgs-backend

          else
            echo "Deployment failed. Rolling back."

            sed -i \
              's|^BACKEND_IMAGE=.*|BACKEND_IMAGE=lgs-backend:rollback|' \
              .env

            docker compose up -d --no-deps --no-build lgs-backend

            if health_check; then
              echo "Rollback health check passed"
            else
              echo "WARNING: Rolled-back backend is unhealthy"
            fi

            exit 1
          fi
          REMOTE
