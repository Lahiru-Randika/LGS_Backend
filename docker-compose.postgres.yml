services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lgs
      POSTGRES_USER: lgs_app
      POSTGRES_PASSWORD: local_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - lgs_postgres_data:/var/lib/postgresql/data

volumes:
  lgs_postgres_data:
